<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRetail AI – Branch POS Terminal</title>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pos.css" />
</head>
<body class="pos-body">

  <div class="pos-container">
    <!-- POS Top Navigation Bar -->
    <header class="pos-header">
      <div class="pos-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>POS Terminal <span style="color:#38bdf8;">Phnom Penh Central</span></span>
      </div>

      <div class="pos-meta-group">
        <div class="pos-badge-branch">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <span id="pos-branch-name">Phnom Penh Central (B001)</span>
        </div>

        <div style="display:flex; align-items:center; gap:6px; color:#cbd5e1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"></circle><path d="M5.5 21v-2a6.5 6.5 0 0 1 13 0v2"></path></svg>
          <span id="pos-cashier-name">Sopheak Lim (Cashier)</span>
        </div>

        <div style="font-family:'JetBrains Mono', monospace; font-weight:700; color:#38bdf8;" id="pos-clock">
          12:00:00 PM
        </div>

        <button class="btn btn-secondary btn-sm" id="pos-history-btn" style="background:#1e293b; color:white; border-color:#334155;">
          Sales History
        </button>

        <a href="admin.html" class="btn btn-secondary btn-sm" style="background:#1e293b; color:#93c5fd; border-color:#334155;">
          Admin View
        </a>
      </div>
    </header>

    <!-- Main POS Screen -->
    <div class="pos-main">
      <!-- Left: Products Catalog & Barcode Scanner Panel -->
      <section class="pos-catalog-panel">
        <!-- Top Search / Barcode Bar -->
        <div class="pos-search-bar">
          <div class="input-icon-wrapper flex-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="pos-search-input" class="form-input" placeholder="Scan barcode or type SKU (e.g. ANK-20W, BAS-C1M, JBL-520)..." autofocus />
          </div>
          <span class="sim-pill" style="white-space:nowrap;">Branch Stock Live</span>
        </div>

        <!-- Category Chip Filter Strip -->
        <div class="pos-categories-strip" id="pos-cat-chips">
          <!-- Loaded dynamically -->
        </div>

        <!-- Product Cards Grid -->
        <div class="pos-products-grid" id="pos-products-grid">
          <!-- Loaded dynamically -->
        </div>
      </section>

      <!-- Right: Active Sale Cart / Ticket Panel -->
      <aside class="pos-ticket-panel">
        <div class="pos-ticket-header">
          <div>
            <h3 style="font-size:14px; font-weight:700; margin:0;">Active Sale Ticket</h3>
            <span style="font-size:11px; color:#64748b;" id="pos-ticket-count">0 items</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="pos-clear-cart-btn" style="color:#ef4444; font-size:11px;">
            Clear Cart
          </button>
        </div>

        <!-- Customer Selector Bar -->
        <div class="pos-customer-bar">
          <span style="font-size:12px; font-weight:600; color:#475569;">Customer:</span>
          <select id="pos-customer-select" class="form-select flex-1" style="font-size:12px; padding:4px 8px;">
            <!-- Options dynamically populated from customers.js -->
          </select>
        </div>

        <!-- Ticket Line Items -->
        <div class="pos-ticket-items" id="pos-ticket-items">
          <!-- Injected dynamically -->
        </div>

        <!-- Totals & Calculations Summary -->
        <div class="pos-ticket-summary">
          <div class="pos-summary-line">
            <span>Subtotal:</span>
            <span id="pos-subtotal">$0.00</span>
          </div>

          <div class="pos-summary-line" style="color:#059669;">
            <span>Discount Applied:</span>
            <span id="pos-discount">-$0.00</span>
          </div>

          <div class="pos-total-line">
            <span>TOTAL (USD):</span>
            <span id="pos-total" style="color:var(--foreground);">$0.00</span>
          </div>
          <div class="pos-summary-line" style="font-weight:600; color:var(--muted-foreground); font-size:11px; padding-top:2px;">
            <span>TOTAL (KHR):</span>
            <span id="pos-total-khr" style="font-weight:700; color:#2563eb;">0 ៛</span>
          </div>
        </div>

        <!-- POS Checkout Action Buttons (Direct Cash & KHQR Tenders) -->
        <div class="pos-ticket-actions" style="display:flex; flex-direction:column; gap:8px; padding:12px 16px;">
          <!-- Primary Dual Tenders (Direct 1-Click Payment) -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="btn btn-primary" id="pos-quick-khqr-btn" disabled style="background:#be123c; border-color:#9f1239; font-weight:700; padding:10px 8px; font-size:13px; box-shadow:0 2px 8px rgba(190,18,60,0.25);">
              🇰🇭 Bakong KHQR
            </button>
            <button class="btn btn-success" id="pos-quick-cash-btn" disabled style="background:#10b981; border-color:#059669; font-weight:700; padding:10px 8px; font-size:13px; box-shadow:0 2px 8px rgba(16,185,129,0.25);">
              💵 Cash Tender
            </button>
          </div>

          <!-- Secondary Actions: Discount & Charge Station -->
          <div style="display:grid; grid-template-columns:1fr 2fr; gap:8px;">
            <button class="btn btn-secondary btn-sm" id="pos-discount-btn" style="font-size:12px;">
              Apply Discount
            </button>
            <button class="btn btn-outline btn-sm" id="pos-checkout-btn" disabled style="font-weight:600; font-size:12px;">
              Payment Station &rarr;
            </button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data/initial-data.js"></script>
  <script src="js/core/event-bus.js"></script>
  <script src="js/core/state-manager.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/services/inventory-service.js"></script>
  <script src="js/services/payment-service.js"></script>
  <script src="js/services/sales-service.js"></script>
  <script src="js/services/order-service.js"></script>
  <script src="js/services/transfer-service.js"></script>
  <script src="js/services/purchase-service.js"></script>
  <script src="js/services/return-service.js"></script>
  <script src="js/services/report-service.js"></script>
  <script src="js/services/ai-service.js"></script>
  <script src="js/components/icons.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/demo-bar.js"></script>
  <script src="js/apps/pos-app.js"></script>
</body>
</html>
